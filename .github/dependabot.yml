version: 2

registries:
  github-private:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.DEPENDABOT_GIT_TOKEN}}

updates:
  - package-ecosystem: gitsubmodule
    directory: /
    registries:
      - github-private
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 3
      exclude:
        - "*"
    groups:
      workspace-submodules:
        patterns:
          - "*"
    labels:
      - dependencies
      - submodules
    commit-message:
      prefix: "chore(submodules)"
    open-pull-requests-limit: 1
