version: 2

updates:
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    groups:
      workspace-submodules:
        patterns:
          - "*"
    labels:
      - dependencies
      - submodules
    commit-message:
      prefix: "chore(submodules)"
    open-pull-requests-limit: 1
